name: Smoketest

on:
  # Automatically run after PSP Build succeeds
  workflow_run:
    workflows: ["PSP Build"]
    types:
      - completed

  # Also allow manual execution
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Start EBOOT in PPSSPP

    # Automatic run: only test successful builds.
    # Manual run: always run.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download latest successful build
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          workflow_conclusion: success
          name: 2048-PSP
          path: dist/
          branch: main

      - name: Download triggering build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: 2048-PSP
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify EBOOT
        run: |
          set -euo pipefail

          test -s dist/PSP/GAME/2048/EBOOT.PBP

          echo "=== EBOOT.PBP ==="
          ls -lh dist/PSP/GAME/2048/EBOOT.PBP

      - name: Run EBOOT in PPSSPP Headless
        run: |
          set -euo pipefail

          echo "Starting 2048 in PPSSPP..."

          docker run --rm \
            --shm-size=8g \
            --volume "$GITHUB_WORKSPACE:/source" \
            --workdir /source \
            ghcr.io/hrydgard/ppsspp-headless:latest \
            /source/dist/PSP/GAME/2048/EBOOT.PBP
