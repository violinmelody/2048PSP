name: Smoketest

on:
  workflow_run:
    workflows: ["PSP Build"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Start EBOOT in PPSSPP
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download latest successful build
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          workflow_conclusion: success
          name: 2048-PSP
          path: dist/
          branch: main

      - name: Download triggering build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: 2048-PSP
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify EBOOT
        run: |
          set -euo pipefail

          EBOOT="dist/PSP/GAME/2048/EBOOT.PBP"

          test -s "$EBOOT"

          echo "=== EBOOT.PBP ==="
          ls -lh "$EBOOT"

      - name: Pull PPSSPP
        run: |
          set -euo pipefail

          docker pull linuxserver/ppsspp:latest

      - name: Start EBOOT in PPSSPP
        run: |
          set -euo pipefail

          EBOOT="$GITHUB_WORKSPACE/dist/PSP/GAME/2048/EBOOT.PBP"

          echo "=== Starting EBOOT in PPSSPP ==="

          set +e

          timeout --signal=SIGTERM 30s \
            docker run --rm \
            --shm-size=8g \
            --volume "$EBOOT:/game/EBOOT.PBP:ro" \
            linuxserver/ppsspp:latest \
            /game/EBOOT.PBP

          status=$?

          set -e

          if [ "$status" -eq 124 ]; then
            echo "PPSSPP remained running for 30 seconds."
            echo "EBOOT successfully started."
            exit 0
          fi

          if [ "$status" -eq 0 ]; then
            echo "PPSSPP exited normally."
            echo "EBOOT successfully started."
            exit 0
          fi

          echo "PPSSPP exited with status $status"
          exit "$status"
