name: Smoketest

on:
  workflow_run:
    workflows: ["PSP Build"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Start EBOOT in PPSSPP

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download latest successful build
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          workflow_conclusion: success
          name: 2048-PSP
          path: dist/
          branch: main

      - name: Download triggering build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: 2048-PSP
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify EBOOT
        run: |
          set -euo pipefail

          test -s dist/PSP/GAME/2048/EBOOT.PBP

          echo "=== EBOOT.PBP ==="
          ls -lh dist/PSP/GAME/2048/EBOOT.PBP

      - name: Build PPSSPP Headless
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/hrydgard/ppsspp.git ppsspp

          cd ppsspp

          echo "=== Build PPSSPP Headless ==="

          ./b.sh --headless

          test -x build/PPSSPPHeadless || \
            test -x build/PPSSPPHeadless/PPSSPPHeadless || \
            find build -name PPSSPPHeadless -type f -print

      - name: Locate PPSSPP Headless
        run: |
          set -euo pipefail

          PPSSPP_HEADLESS="$(find ppsspp/build -name PPSSPPHeadless -type f -executable | head -n 1)"

          if [ -z "$PPSSPP_HEADLESS" ]; then
            echo "PPSSPPHeadless was not found."
            find ppsspp/build -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Found: $PPSSPP_HEADLESS"

          cp "$PPSSPP_HEADLESS" ./PPSSPPHeadless
          chmod +x ./PPSSPPHeadless

      - name: Start EBOOT in PPSSPP
        run: |
          set -euo pipefail

          echo "Starting 2048 in PPSSPP..."

          set +e

          timeout --signal=SIGTERM 30s \
            ./ppsspp/PPSSPPHeadless \
            dist/PSP/GAME/2048/EBOOT.PBP

          status=$?

          set -e

          if [ "$status" -eq 124 ]; then
            echo "PPSSPP stayed alive for 30 seconds."
            echo "EBOOT successfully started."
            exit 0
          fi

          echo "PPSSPP exited with status $status"
          exit "$status"
