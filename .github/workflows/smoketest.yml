name: Smoketest

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["PSP Build"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  smoketest:
    name: Start EBOOT in PPSSPP
    runs-on: ubuntu-24.04

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download build artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          workflow_conclusion: success
          name: 2048-PSP
          path: dist/
          branch: main
          repo: violinmelody/2048PSP
          github_token: ${{ github.token }}

      - name: Verify EBOOT
        shell: bash
        run: |
          set -euo pipefail

          EBOOT="dist/PSP/GAME/2048/EBOOT.PBP"

          test -s "$EBOOT"

          echo "=== EBOOT.PBP ==="
          ls -lh "$EBOOT"
          file "$EBOOT"

      - name: Pull PPSSPP image
        shell: bash
        run: |
          set -euo pipefail
          docker pull linuxserver/ppsspp:latest

      - name: Smoke test EBOOT with PPSSPP Headless
        shell: bash
        run: |
          set -euo pipefail

          EBOOT="$GITHUB_WORKSPACE/dist/PSP/GAME/2048/EBOOT.PBP"

          echo "=== Starting EBOOT in PPSSPP Headless ==="

          # Put the EBOOT in a container-owned writable filesystem.
          # This avoids the permission problem caused by the previous
          # :ro bind mount and avoids the image's normal GUI entrypoint.
          docker create \
            --name ppsspp-smoketest \
            --shm-size=8g \
            --entrypoint /bin/bash \
            linuxserver/ppsspp:latest \
            -lc '
              set -e

              echo "=== PPSSPP executable ==="
              test -x /usr/bin/PPSSPPHeadless
              /usr/bin/PPSSPPHeadless --help >/dev/null 2>&1 || true

              echo "=== EBOOT ==="
              test -s /game/EBOOT.PBP
              ls -lh /game/EBOOT.PBP

              echo "=== Launching PPSSPP ==="
              exec /usr/bin/PPSSPPHeadless \
                --headless \
                /game/EBOOT.PBP
            '

          # Copy the artifact into the container instead of mounting it.
          docker cp "$EBOOT" ppsspp-smoketest:/game/EBOOT.PBP

          echo "=== Container EBOOT permissions ==="
          docker exec ppsspp-smoketest ls -lh /game/EBOOT.PBP

          set +e
          timeout --signal=SIGTERM 30s docker start -a ppsspp-smoketest
          status=$?
          set -e

          echo "PPSSPP exit status: $status"

          if [ "$status" -eq 124 ]; then
            echo "PPSSPP remained running for 30 seconds."
            echo "EBOOT successfully started."
            docker rm -f ppsspp-smoketest >/dev/null 2>&1 || true
            exit 0
          fi

          if [ "$status" -eq 0 ]; then
            echo "PPSSPP exited normally."
            echo "EBOOT successfully started."
            docker rm -f ppsspp-smoketest >/dev/null 2>&1 || true
            exit 0
          fi

          echo "PPSSPP failed with status $status"
          docker rm -f ppsspp-smoketest >/dev/null 2>&1 || true
          exit "$status"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f ppsspp-smoketest >/dev/null 2>&1 || true
