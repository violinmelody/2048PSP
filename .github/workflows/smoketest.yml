name: Smoketest

on:
  # Automatically test after PSP Build succeeds
  workflow_run:
    workflows: ["PSP Build"]
    types:
      - completed

  # Also allow manually running the test
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Start EBOOT in PPSSPP
    # For automatic runs: only continue if the build succeeded.
    # For manual runs: always continue.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download latest build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          workflow_conclusion: success
          name: 2048-PSP
          path: dist/
          branch: main

      - name: Download triggering build artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: 2048-PSP
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify EBOOT
        run: |
          set -euo pipefail

          test -s dist/PSP/GAME/2048/EBOOT.PBP

          echo "=== EBOOT.PBP ==="
          ls -lh dist/PSP/GAME/2048/EBOOT.PBP

      - name: Download PPSSPP
        run: |
          set -euo pipefail

          wget -O PPSSPP.AppImage \
            https://github.com/hrydgard/ppsspp/releases/latest/download/PPSSPPHeadless.AppImage

          chmod +x PPSSPP.AppImage

      - name: Verify PPSSPP
        run: |
          set -euo pipefail

          ./PPSSPP.AppImage --version

      - name: Start EBOOT in PPSSPP
        run: |
          set -euo pipefail

          echo "Starting 2048 in PPSSPP..."

          set +e

          timeout --signal=SIGTERM 30s \
            ./PPSSPP.AppImage \
              --headless \
              dist/PSP/GAME/2048/EBOOT.PBP

          status=$?

          set -e

          # 124 means timeout killed PPSSPP after 30 seconds.
          # That's considered success: PPSSPP remained alive.
          if [ "$status" -eq 124 ]; then
            echo "PPSSPP ran for 30 seconds."
            echo "EBOOT successfully started."
            exit 0
          fi

          echo "PPSSPP exited with status $status"
          exit "$status"
